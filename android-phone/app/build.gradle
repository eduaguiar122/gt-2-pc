plugins { id 'com.android.application' }
android {
    namespace 'io.github.gt2pc.phone'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.github.gt2pc.phone'
        // Android 12+; the renderer needs a Vulkan 1.3 GPU with dynamic rendering (checked at start-up).
        minSdk 31
        targetSdk 35
        versionCode 5
        versionName '0.9.2-phone.5'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DBUILD_TESTING=OFF', '-DGT2_ANDROID_PHONE=ON'; targets 'gt2game' } }
    }
    externalNativeBuild { cmake { path file('../../CMakeLists.txt'); version '3.22.1' } }
    // CI (android-phone.yml) signs test builds with one kept key, so that each APK installs over the previous one.
    signingConfigs {
        debug {
            def keystore = System.getenv('GT2_DEBUG_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
        release {
            debuggable false
            minifyEnabled false
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }
}
